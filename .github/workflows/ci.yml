name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          SHFMT_VERSION="3.12.0"
          curl -fsSLo /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Check Bash syntax
        run: |
          bash -n bin/flenv
          find lib shell test -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Check formatting
        run: shfmt -d bin/flenv lib shell test

      - name: Run ShellCheck
        run: shellcheck -e SC1091 bin/flenv lib/*.sh lib/commands/*.sh shell/*.sh test/*.sh

      - name: Run CLI tests
        run: bash test/cli.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check help lists all commands
        run: |
          cargo run -- --help | grep -q setup
          cargo run -- --help | grep -q doctor
          cargo run -- --help | grep -q list
          cargo run -- --help | grep -q "use "
          cargo run -- --help | grep -q "env "
          cargo run -- --help | grep -q emulator
          cargo run -- --help | grep -q view
          cargo run -- emulator --help | grep -q create
          cargo run -- emulator --help | grep -q "list"
          cargo run -- emulator --help | grep -q start
